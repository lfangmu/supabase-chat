<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>微聊 · 离线</title>
  <meta name="theme-color" content="#07C160">
  <style>
    :root { --primary: #07C160; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #191919;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .08);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      font-size: 30px;
      font-weight: 600;
      line-height: 64px;
    }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #888; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">微</div>
    <h1>网络连接不可用</h1>
    <p>当前处于离线状态，请检查网络后重试。</p>
    <button type="button" onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
